<div class="container">
    <label>Brand</label>
    <input type="text" #brand (input)="selectAutos(brand.value, sort.value)">
    <fa-icon [icon]="faMagnifyingGlass" />

    <label>Sort by price</label>
    <select #sort (change)="selectAutos(brand.value, sort.value)">
        <option value="">Default</option>
        <option value="asc">Price: low to high</option>
        <option value="desc">Price: high to low</option>
    </select>
</div>

<p class="count">{{ selectedAutos.length }} car(s) found</p>

<div class="cars-container">
  @for(auto of selectedAutos; track auto.id){
    <div class="auto-card">
        <img [src]="`images/${auto.photo}`">

        @if(auto.availability <= 3){
          <span class="badge">Low stock</span>
        }

        <div class="details">
            <h3>{{auto.brand}} {{auto.model}}</h3>
            <p>
                power: {{auto.power}} <br>
                only: {{auto.availability}} units in stock
            </p>
            <p class="price">{{auto.price}} DNT</p>
        </div>

        <div class="see-more">
            <button [routerLink]="['/car', auto.id]">See more...</button>
        </div>
    </div>
  } @empty {
    <p class="empty">No car found for this brand</p>
  }
</div>
